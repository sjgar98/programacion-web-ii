name: Deployment

on:
  push:
    branches:
      - main

jobs:
  deployment:
    name: Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mysqli
          coverage: none
          tools: composer

      - name: Checkout
        uses: actions/checkout@v6

      - name: Controlar sintaxis de PHP
        uses: mlocati/check-php-syntax@v1
        with:
          directory: .
          include: |
            index.php
          fail-on-warnings: true

      - name: Prevenir cambios de SQL
        id: changed-markdown-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            database/*.sql

      - name: Desplegar a Hosting via FTP
        if: ${{ secrets.FTP_PROTOCOL != 'sftp' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          protocol: ${{ secrets.FTP_PROTOCOL }}
          server: ${{ secrets.FTP_HOSTNAME }}
          port: ${{ secrets.FTP_PORT }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            config.ini

      - name: Desplegar a Hosting via SSH
        if: ${{ secrets.FTP_PROTOCOL == 'sftp' }}
        uses: wangyucode/sftp-upload-action@v3
        with:
          host: ${{ secrets.FTP_HOSTNAME }}
          port: ${{ secrets.FTP_PORT }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          localDir: ./
          remoteDir: ${{ secrets.FTP_SERVER_DIR }}
          concurrency: 10
          exclude: '**/.git*,**/.git*/**,**/config.ini'

      - name: Buildear imagen de Docker y publicar en GHCR
        uses: macbre/push-to-ghcr@master
        with:
          image_name: ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          image_tag: latest

      - name: Limpiar imagenes de Docker sin taggear
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          delete-untagged: true
